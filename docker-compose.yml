services:
  widgets-ssr:
    image: node:22-alpine
    container_name: widgets-ssr
    ports:
      - "3001:3001"

    working_dir: /app
    volumes:
      - .:/app
      - ../../ReactEdge:/workspace
    command: sh -c "npm install && npm run start"
    expose:
      - "3001:3001"

    networks:
      - mageos_network

networks:
  mageos_network:
    external: true