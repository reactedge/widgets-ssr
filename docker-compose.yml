services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_ssr_widgets

    ports:
      - "8097:80"
      - "8460:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      - widgets-ssr
    networks:
      - mageos_network


  widgets-ssr:
    image: node:22-alpine
    container_name: widgets-ssr

    working_dir: /app
    volumes:
      - .:/app
      - ../../ReactEdge:/workspace
    command: sh -c "npm install && npm run start"
    expose:
      - "3001"

    networks:
      - mageos_network

networks:
  mageos_network:
    external: true