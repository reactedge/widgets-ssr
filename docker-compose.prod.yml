services:

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_ssr_widgets

    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

    depends_on:
      - widgets-ssr


  widgets-ssr:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: widgets-ssr

    restart: unless-stopped

    expose:
      - "3001"